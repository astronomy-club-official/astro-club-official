<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavBar</title>
  </head>
  <body>
    <nav>
      <a class="logo" href="/">
        <div>
          <img src="images/Club_Logo_Black_BG-removebg-preview.png" alt="Astronomy Club Logo" />
        </div>
        Astronomy Club
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/partener">Partners</a></li>
        <li><a href="https://gaac.stemastronomyclub.org/" target="_blank">GAAC</a></li>
        <li><a href="https://astravale.stemastronomyclub.org/" target="_blank">AstraVale</a></li>
        <li><a href="/#gallery">Gallery</a></li>
        <li><a href="/donate">Donate</a></li>
      </ul>

      <div class="nav-center">
        <button
          class="theme-toggle-btn"
          id="theme-toggle-btn"
          onclick="toggleTheme()"
          aria-label="Toggle Light and Dark Mode"
          type="button"
        >
          <span class="theme-toggle-track">
            <span class="theme-icon sun-icon"><i class="fa-solid fa-sun"></i></span>
            <span class="theme-icon moon-icon"><i class="fa-solid fa-moon"></i></span>
            <span class="theme-toggle-thumb">
              <i class="fa-solid fa-moon thumb-moon"></i>
              <i class="fa-solid fa-sun thumb-sun"></i>
            </span>
          </span>
        </button>
      </div>

      <button
        class="nav-hamburger"
        id="nav-hamburger"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </body>
</html>
